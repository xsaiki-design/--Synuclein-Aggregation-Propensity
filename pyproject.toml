[project]
name = "asyn-aggregation"
version = "0.1.0"
description = "How much of alpha-synuclein aggregation-rate variation is sequence vs. experimental conditions."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "pdfplumber>=0.10",   # ingest from the supplementary PDF
    "tabulate>=0.9",      # DataFrame.to_markdown in the results summary
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
